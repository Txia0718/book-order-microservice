spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
    gateway:
      server:
        webflux:
          routes:
            - id: order-service-route
              uri: lb://order-service
              predicates:
                - Path=/order-service/**
              filters:
                - StripPrefix=1
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: 8719
      eager: true
      datasource:
        gw-flow-rules:
          nacos:
            server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
            dataId: gateway-flow-rules
            groupId: SENTINEL_GROUP
            rule-type: gw-flow
server:
  port: 8083
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
management:
  tracing:
    sampling:
      probability: 1.0   # 采样率，生产环境建议 0.1，开发测试用 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:${ZIPKIN_PORT:9411}/api/v2/spans   # Zipkin 服务端地址
  endpoints:
    web:
      exposure:
        include: health,info,trace   # 暴露追踪端点（可选）